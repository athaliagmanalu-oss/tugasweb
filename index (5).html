<!DOCTYPE html> 
<html lang="id"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Pendaftaran Workshop</title> 
        <!-- Memanggil Bootstrap 5 --> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    </head> 
    
    <body class="bg-body-tertiary">
        <main class="container py-5" style="max-width: 540px;">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Pendaftaran Workshop Web</h1>
                    <form id="formDaftar" novalidate>

                        <div class="mb-3">
                            <label for="nama" class="form-label">Nama lengkap</label>
                            <input id="nama" type="text" class="form-control" placeholder="Contoh: Andi Pratama" minlength="3">
                            <div id="nama-error" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" type="email" class="form-control" placeholder="nama@domain.com">
                            <div id="email-hint" class="form-text"> Contoh: nama@domain.com </div>
                            <div id="email-error" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="hp" class="form-label">Nomor WhatsApp</label>
                            <input id="hp" type="text" inputmode="numeric" class="form-control" placeholder="081234567890" pattern="08[0-9]{8,11}">
                            <div id="hp-hint" class="form-text"> Diawali 08, 10-13 digit</div>
                            <div id="hp-error" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" type="password" class="form-control" placeholder="Minimal 8 digit" minlength="8">
                            <div id="password-error" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="retypePassword" class="form-label"> Re-type Password </label>
                            <input id="retypePassword" type="password" class="form-control" placeholder="Ulangi password">
                            <div id="retypePassword-error" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-4">
                            <label for="tanggal" class="form-label"> Tanggal Lahir </label>
                            <input id="tanggal" type="date" class="form-control">
                            <div id="tanggal-hint" class="form-text"> Usia minimal 20 tahun. </div>
                            <div id="tanggal-error" class="invalid-feedback"></div>
                        </div>
                        <button id="tombolKirim" type="submit" class="btn btn-primary w-100"> Daftar </button>
                        <div id="statusForm"></div>
                    
                    </form>
                </div>
            </div>
        </main>
        <script src="script.js"></script> 
    </body> 
</html>
